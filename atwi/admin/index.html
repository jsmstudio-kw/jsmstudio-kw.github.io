<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#FFA62B">
<title>عتوي أدمن</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
  :root{
    --bg:#0E0B0A;--card:#1A1513;--card2:#231C19;--ink:#F4ECE6;--muted:#9C8C83;--line:#2E2522;
    --gold:#FFB020;--gold2:#FFD45A;--green:#3DDC84;--blue:#4DA3FF;--pink:#FF6B8B;--violet:#A67CFF;--red:#FF5A4E;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:#F38A1D}
  body{color:var(--ink);font-family:-apple-system,"SF Arabic","Segoe UI",Tahoma,Arial,sans-serif;-webkit-tap-highlight-color:transparent;
    background:linear-gradient(180deg,#FFA62B 0%,#F38A1D 45%,#E8761E 100%);min-height:100vh}

  .top{padding:calc(env(safe-area-inset-top) + 16px) 16px 8px}
  .bar{display:flex;align-items:center;gap:12px;max-width:760px;margin:0 auto}
  .bar img{width:46px;height:46px;border-radius:14px;box-shadow:0 4px 12px rgba(90,40,0,.35)}
  .bar h1{margin:0;font-size:21px;font-weight:900;color:#2A1608}
  .bar .sub{font-size:12px;color:var(--muted);margin-top:2px}
  .bar .live{display:inline-flex;align-items:center;gap:6px;color:#1E5E2E;font-weight:800}
  .bar .live i{width:7px;height:7px;border-radius:50%;background:#1E9E4A;animation:p 1.8s infinite}
  @keyframes p{0%{box-shadow:0 0 0 0 rgba(61,220,132,.7)}70%{box-shadow:0 0 0 7px rgba(61,220,132,0)}100%{box-shadow:0 0 0 0 rgba(61,220,132,0)}}
  .bar .sp{flex:1}
  .bar button{background:var(--card2);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-weight:800;font-size:13px}

  main{max-width:760px;margin:10px auto 0;padding:0 14px 30px}

  .hero{background:linear-gradient(160deg,#2A1F14,#16110F 70%);border:1px solid #3A2C1C;box-shadow:0 10px 24px rgba(90,40,0,.35);border-radius:22px;padding:18px;margin-bottom:12px}
  .hero .l{font-size:13px;color:var(--muted);font-weight:700}
  .hero .v{font-size:48px;font-weight:900;line-height:1.1;margin:4px 0 14px;background:linear-gradient(180deg,var(--gold2),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
  .split{display:flex;height:8px;border-radius:999px;overflow:hidden;background:var(--line);gap:3px}
  .split .i{background:var(--blue);border-radius:999px}
  .split .a{background:var(--green);border-radius:999px}
  .legend{display:flex;gap:16px;margin-top:12px;font-size:13px;font-weight:700}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .legend b{width:9px;height:9px;border-radius:50%;display:inline-block}
  .legend .asof{margin-inline-start:auto;color:var(--muted);font-weight:600}

  .tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:18px}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;position:relative;overflow:hidden}
  .tile::after{content:"";position:absolute;width:90px;height:90px;border-radius:50%;background:var(--c);opacity:.14;filter:blur(18px);inset-inline-end:-20px;top:-30px}
  .tile .ic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-size:17px;background:color-mix(in srgb,var(--c) 18%,transparent)}
  .tile .v{font-size:28px;font-weight:900;margin-top:10px;color:var(--c)}
  .tile .l{font-size:13px;color:var(--ink);font-weight:800;opacity:.85}
  .tile .s{font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  h2{font-size:17px;margin:6px 4px 10px;font-weight:900;color:#2A1608;display:flex;align-items:center;gap:8px}
  h2 .n{background:var(--card2);color:var(--gold);border:1px solid var(--line);border-radius:999px;font-size:12px;padding:2px 9px}

  .seg{display:flex;background:rgba(42,22,8,.85);border:1px solid var(--line);border-radius:999px;padding:4px;margin-bottom:12px}
  .seg button{flex:1;border:0;background:transparent;padding:9px;border-radius:999px;font-weight:800;color:var(--muted);font-size:14px}
  .seg button.on{background:var(--card2);color:var(--ink);box-shadow:inset 0 0 0 1px #3A2F2B}

  input.q{width:100%;border:1px solid var(--line);border-radius:14px;padding:13px 14px;font-size:15px;margin-bottom:12px;background:var(--card);color:var(--ink)}
  input.q::placeholder{color:var(--muted)}
  input.q:focus{outline:none;border-color:var(--gold)}

  .pod{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:8px;align-items:end;margin-bottom:12px}
  .pc{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 8px;text-align:center;min-width:0}
  .pc.g1{background:linear-gradient(180deg,#3A2A10,#1E160D);border-color:#6B4E14;padding-top:18px;box-shadow:0 8px 24px rgba(255,176,32,.18)}
  .pc .m{font-size:26px}
  .pc .nm{font-weight:900;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px}
  .pc .lv{font-size:22px;font-weight:900;margin-top:2px}
  .pc.g1 .lv{color:var(--gold2)}
  .pc .lv small{font-size:11px;font-weight:700;color:var(--muted)}

  .row{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:11px 12px;margin-bottom:8px;display:flex;align-items:center;gap:12px}
  .rk{width:30px;height:30px;border-radius:10px;background:var(--card2);display:grid;place-items:center;font-weight:900;font-size:13px;color:var(--muted);flex:none}
  .who{flex:1;min-width:0}
  .who .n{font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px}
  .who .e{color:#7FB8FF;font-size:12px;direction:ltr;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.85}
  .who .t{color:var(--muted);font-size:11px;margin-top:1px}
  .today{background:rgba(61,220,132,.14);color:var(--green);font-size:10px;font-weight:900;border-radius:999px;padding:2px 7px;flex:none}
  .pill{background:var(--card2);border:1px solid #3A2F2B;border-radius:12px;padding:6px 10px;text-align:center;flex:none;min-width:56px}
  .pill .v{font-weight:900;font-size:17px;line-height:1;color:var(--gold2)}
  .pill .l{font-size:10px;color:var(--muted)}

  .links{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0 10px}
  .links a{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:center;color:var(--ink);text-decoration:none;font-weight:800;font-size:14px}
  .muted{color:#5A2E0C;font-size:12px;text-align:center;line-height:1.6;white-space:pre-line}
  .center{text-align:center;padding:36px 16px}
  .big{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#2A1A08;border:0;border-radius:999px;padding:14px 30px;font-weight:900;font-size:17px}
  .err{color:var(--red);font-weight:700}
  .login{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:26px 18px;text-align:center}
  .login p{font-weight:700;margin:0 0 18px}

  .rep{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:8px}
  .rep .h{display:flex;gap:8px;align-items:center;font-weight:900;font-size:14px;flex-wrap:wrap}
  .rep .h .ty{background:var(--card2);border-radius:999px;padding:2px 9px;font-size:11px;color:var(--gold)}
  .rep .h .muted{color:var(--muted)}
  .rep .x{margin:8px 0;padding:9px 11px;background:var(--card2);border-radius:12px;font-size:15px;white-space:pre-wrap;word-break:break-word}
  .rep img{width:96px;height:96px;border-radius:50%;object-fit:cover;display:block;margin:8px 0}
  .rep .b{display:flex;gap:6px;flex-wrap:wrap}
  .rep .b button{border:0;border-radius:999px;padding:8px 12px;font-weight:900;font-size:13px;background:var(--card2);color:var(--ink)}
  .rep .b button.red{background:var(--red);color:#fff}
  .rep .b button.gold{background:var(--gold);color:#2A1A08}
  .tiles{grid-template-columns:repeat(2,1fr)}

  /* ---- 2.1.0 */
  .tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 10px;margin:0 -2px;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tabs button{flex:none;border:0;border-radius:999px;padding:9px 14px;font-weight:900;font-size:14px;background:rgba(42,22,8,.82);color:#E9D9CC;position:relative}
  .tabs button.on{background:#2A1608;color:var(--gold2);box-shadow:inset 0 0 0 2px var(--gold)}
  .tabs button .bd{position:absolute;top:-4px;left:-4px;background:var(--red);color:#fff;border-radius:999px;font-size:11px;min-width:18px;height:18px;line-height:18px;padding:0 5px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
  .card h3{margin:0 0 10px;font-size:15px;font-weight:900;display:flex;align-items:center;gap:8px}
  .card h3 small{margin-inline-start:auto;color:var(--muted);font-size:12px;font-weight:700}
  .bars{display:flex;align-items:flex-end;gap:4px;height:120px;padding-top:16px}
  .bars .c{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0;height:100%;justify-content:flex-end}
  .bars .b{width:100%;border-radius:6px 6px 3px 3px;background:linear-gradient(180deg,var(--gold2),var(--gold));min-height:3px;position:relative}
  .bars .b span{position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-size:10px;font-weight:900;color:var(--ink)}
  .bars .x{font-size:9.5px;color:var(--muted);white-space:nowrap}
  .hrow{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:13px;font-weight:800}
  .hrow .k{width:74px;color:var(--muted);flex:none;direction:ltr;text-align:right}
  .hrow .t{flex:1;height:14px;background:var(--card2);border-radius:999px;overflow:hidden}
  .hrow .t i{display:block;height:100%;background:linear-gradient(90deg,var(--violet),var(--blue));border-radius:999px}
  .hrow .v{width:34px;text-align:left;flex:none}
  .mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .mini div{background:var(--card2);border-radius:14px;padding:10px 6px;text-align:center}
  .mini b{display:block;font-size:20px;color:var(--gold2)}
  .mini span{font-size:11px;color:var(--muted);font-weight:700}
  .av{width:34px;height:34px;border-radius:50%;object-fit:cover;flex:none;background:#3A2C1C;display:grid;place-items:center;font-size:18px;overflow:hidden}
  .row{cursor:pointer}
  .tools{display:flex;gap:8px;margin-bottom:10px}
  .tools select,.tools button{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:10px;font-weight:800;font-size:13px}
  .tools select{flex:1}
  .msg{display:flex;gap:8px;align-items:flex-start;margin-bottom:8px}
  .msg .bb{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 11px;flex:1;min-width:0}
  .msg .bb .n{font-weight:900;font-size:13px;color:var(--gold)}
  .msg .bb .tx{font-size:15px;white-space:pre-wrap;word-break:break-word}
  .msg .bb .tm{font-size:10.5px;color:var(--muted)}
  .msg .bb.hid{opacity:.5;border-color:var(--red)}
  .msg .del{background:var(--card2);border:0;border-radius:10px;color:var(--ink);padding:7px 9px;font-size:14px}
  .sw{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-weight:800;font-size:14px}
  .sw:last-child{border-bottom:0}
  .sw .tg{margin-inline-start:auto;width:52px;height:30px;border-radius:15px;border:0;position:relative;background:#5a514a;transition:.2s}
  .sw .tg.on{background:var(--green)}
  .sw .tg::after{content:'';position:absolute;top:3px;inset-inline-end:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}
  .sw .tg.on::after{inset-inline-end:25px}
  .sw input.n{margin-inline-start:auto;width:70px;text-align:center;border:1px solid var(--line);border-radius:12px;padding:7px;font-size:16px;font-weight:900;background:var(--card2);color:var(--ink)}
  textarea.q,input.q2{width:100%;border:1px solid var(--line);border-radius:14px;padding:11px 13px;font-size:15px;margin:6px 0 10px;background:var(--card2);color:var(--ink);font-family:inherit}
  .card .big{width:100%;margin-top:6px}
  .sw .s{margin-inline-start:auto;border-radius:999px;padding:3px 11px;font-size:12px;font-weight:900}
  .sw .on{background:rgba(61,220,132,.16);color:var(--green)}
  .sw .off{background:rgba(255,90,78,.16);color:var(--red)}
  .sw .nt{background:var(--card2);color:var(--muted)}
  .sheet{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:9}
  .sheet .in{background:var(--card);border-radius:22px 22px 0 0;width:100%;max-width:560px;padding:18px 16px calc(env(safe-area-inset-bottom) + 18px)}
  .sheet .in .hd{display:flex;align-items:center;gap:12px;margin-bottom:12px}
  .sheet .in .hd .av{width:56px;height:56px;font-size:28px}
  .sheet .in .hd b{font-size:19px}
  .sheet .in .kv{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
  .sheet .in .kv span:first-child{color:var(--muted)}
  .sheet .in .kv span:last-child{font-weight:800;direction:ltr}
  .sheet .in .acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
  .sheet .in .acts button{border:0;border-radius:14px;padding:12px;font-weight:900;font-size:14px;background:var(--card2);color:var(--ink)}
  .sheet .in .acts button.red{background:var(--red);color:#fff}
  .sheet .in .acts button.gold{background:var(--gold);color:#2A1A08}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#2A1608;color:#fff;border-radius:999px;padding:10px 18px;font-weight:800;z-index:10}
  .gal{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .gal div{text-align:center;font-size:11px;font-weight:800;color:var(--muted)}
  .gal img{width:100%;aspect-ratio:1;border-radius:50%;object-fit:cover;display:block;margin-bottom:4px;background:#3A2C1C}
</style>
</head>
<body>
<div class="top">
  <div class="bar">
    <img src="icon.svg" alt="">
    <div>
      <h1>عتوي أدمن</h1>
      <div class="sub"><span class="live"><i></i> مباشر</span></div>
    </div>
    <div class="sp"></div>
    <button id="out" hidden>خروج</button>
  </div>
</div>
<main id="app"><div class="login muted">يحمّل…</div></main>

<script type="module">
const DEMO = location.hash === '#demo';
const $ = (s) => document.querySelector(s);
const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
const SITE = 'https://jsmstudio-kw.github.io/atwi';
const AVATAR_NAMES = { b01: 'غترة وعقال', b02: 'بشت', b03: 'نظارة', b04: 'التاج', b05: 'لاعب كورة', b06: 'رائد فضاء', b07: 'الطباخ', b08: 'نينجا', b09: 'القرصان', b10: 'قيمر', b11: 'المتخرج', b12: 'فانوس رمضان',
  g01: 'الفيونكة', g02: 'الشيلة', g03: 'الأميرة', g04: 'تاج الورد', g05: 'نظارة القلوب', g06: 'الخبّازة', g07: 'الدكتورة', g08: 'المتخرجة', g09: 'رائدة فضاء', g10: 'قيمر', g11: 'الرسّامة', g12: 'فانوس رمضان', u: 'صورته الخاصة' };

let tab = localStorage.getItem('tab') || 'nums';
let board = localStorage.getItem('board') || 'players2';
let sortBy = localStorage.getItem('sort') || 'recent';
let data = { players: [], players2: [] }, emails = {}, q = '';
let reports = [], banned = [], chat = [], photos = null, texts = null;
let stats = null, act = null, ready = false, gcfg = null; // gcfg: settings saved from this page (Firestore config/game)
fetch('stats.json?v=' + Date.now(), { cache: 'no-store' }).then((r) => r.ok ? r.json() : null).then((j) => { if (DEMO) return; stats = j; if (ready) render(); }).catch(() => {});
fetch(SITE + '/texts.json?v=' + Date.now(), { cache: 'no-store' }).then((r) => r.ok ? r.json() : null).then((j) => { if (DEMO) return; texts = j; if (ready) render(); }).catch(() => {});

const day = (d) => d.toLocaleDateString('en-CA');
function ago(d) {
  if (!d) return '—';
  const s = (Date.now() - d.getTime()) / 1000;
  if (s < 90) return 'الحين';
  if (s < 3600) return 'قبل ' + Math.round(s / 60) + ' دقيقة';
  if (s < 86400) return 'قبل ' + Math.round(s / 3600) + ' ساعة';
  return 'قبل ' + Math.round(s / 86400) + ' يوم';
}
function toast(t) { const x = el('div', 'toast', t); document.body.append(x); setTimeout(() => x.remove(), 2200); }
function avatar(p) {
  const a = el('div', 'av');
  const id = p.av || 'cat';
  if (id === 'u') { a.textContent = '📷'; act?.photo(p.id).then((u) => { if (u) { const im = el('img', 'av'); im.src = u; a.replaceWith(im); } }); }
  else if (AVATAR_NAMES[id]) { const im = el('img', 'av'); im.src = SITE + '/avatars/' + id + '.jpg'; im.onerror = () => im.replaceWith(Object.assign(el('div', 'av'), { textContent: '😼' })); return im; }
  else a.textContent = '😼';
  return a;
}
const pending = () => { const g = new Set(); for (const r of reports) g.add((r.type || 'name') + '|' + (r.path || r.uid)); return g.size; };

// ------------------------------------------------------------ page
function render() {
  ready = true;
  const m = $('#app'); m.replaceChildren();
  const tabs = el('div', 'tabs');
  const nRep = pending();
  for (const [k, t, bd] of [['nums', '📊 الأرقام'], ['players', '👥 اللاعبين'], ['chat', '💬 الشات'], ['reports', '🚩 البلاغات', nRep], ['photos', '📷 الصور'], ['game', '🎛️ اللعبة']]) {
    const b = el('button', tab === k ? 'on' : '', t);
    if (bd) b.append(el('span', 'bd', String(bd)));
    b.onclick = () => { tab = k; localStorage.setItem('tab', k); if (k === 'photos' && photos == null && act) act.loadPhotos(); render(); window.scrollTo(0, 0); };
    tabs.append(b);
  }
  m.append(tabs);
  ({ nums, players: playersTab, chat: chatTab, reports: reportsTab, photos: photosTab, game: gameTab }[tab] || nums)(m);
}

// 📊 numbers
function nums(m) {
  const list = data.players2;
  const today = day(new Date());
  const isToday = (p) => p.updated && day(p.updated) === today;
  const week = Date.now() - 7 * 864e5;
  const top = list.reduce((a, p) => (!a || p.best > a.best ? p : a), null);
  const lastP = list.reduce((a, p) => (p.updated && (!a || p.updated > a.updated) ? p : a), null);

  const hero = el('div', 'hero');
  const ios = Number(stats?.ios || 0), and = Number(stats?.android || 0), tot = ios + and;
  hero.append(el('div', 'l', '📲 حمّلوا اللعبة'), el('div', 'v', stats ? tot.toLocaleString('en') : '—'));
  const sp = el('div', 'split'); const i1 = el('div', 'i'), a1 = el('div', 'a');
  i1.style.width = (tot ? ios / tot * 100 : 0) + '%'; a1.style.width = (tot ? and / tot * 100 : 0) + '%';
  sp.append(i1, a1); hero.append(sp);
  const lg = el('div', 'legend');
  const li = el('span'); li.append(Object.assign(el('b'), { style: 'background:var(--blue)' }), document.createTextNode('آيفون ' + ios));
  const la = el('span'); la.append(Object.assign(el('b'), { style: 'background:var(--green)' }), document.createTextNode('أندرويد ' + and));
  lg.append(li, la); if (stats?.asOf) lg.append(el('span', 'asof', 'لين ' + stats.asOf)); hero.append(lg);

  const tiles = el('div', 'tiles');
  const tile = (c, ic, l, v, s) => { const t = el('div', 'tile'); t.style.setProperty('--c', c); const vv = el('div', 'v', String(v)); if (String(v).length > 6) vv.style.fontSize = '19px'; t.append(el('div', 'ic', ic), vv, el('div', 'l', l)); if (s) t.append(el('div', 's', s)); return t; };
  const nEm = Object.keys(emails).length;
  const paid = list.filter((p) => p.av && p.av !== 'cat').length;
  tiles.append(
    tile('var(--blue)', '👤', 'سجّلوا دخول', list.length, nEm ? nEm + ' إيميل محفوظ' : ''),

  };
  tools.append(sel, csv); m.append(tools);
  const inp = el('input', 'q'); inp.placeholder = '🔍 دوّر على اسم أو إيميل'; inp.value = q;

      }, (e) => { $('#app').replaceChildren(el('div', 'login err', 'ما قدرنا نقرا اللاعبين (' + e.code + ')')); }));

    unsub.push(onSnapshot(collection(db, 'emails'), (s) => { emails = {}; s.docs.forEach((d) => { emails[d.id] = d.data().email || ''; }); render(); }, () => {}));

    unsub.push(onSnapshot(doc(db, 'config', 'game'), (d) => { gcfg = d.exists() ? d.data() : null; if (tab === 'game') render(); }, () => {}));

    unsub.push(onSnapshot(query(collection(db, 'chat'), orderBy('at', 'desc'), limit(60)), (s) => { chat = s.docs.map((d) => ({ id: d.id, ...d.data(), at: at(d.data().at) })); if (tab === 'chat' || tab === 'nums') render(); }, () => {}));
  };

  onAuthStateChanged(auth, (u) => {
    unsub.forEach((x) => x()); unsub = [];
    $('#out').hidden = !u;
    if (!u) return showLogin();
    if ((u.email || '').toLowerCase() !== ADMIN_EMAIL) { signOut(auth); return showLogin('هذا الحساب مو مسموح له. ادخل بـ ' + ADMIN_EMAIL); }
    listen();
    if (tab === 'photos') act.loadPhotos();
  });
}
